services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_ranking
      POSTGRES_USER: ai_ranking
      POSTGRES_PASSWORD: ai_ranking
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_ranking -d ai_ranking"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://ai_ranking:ai_ranking@postgres:5432/ai_ranking}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      APP_VERSION: ${APP_VERSION:-1.0.0-rc2.1}
      PROVIDER_MOCK_MODE: ${PROVIDER_MOCK_MODE:-true}
      RUN_MIGRATIONS: "true"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      GRACEFUL_SHUTDOWN_SECONDS: ${GRACEFUL_SHUTDOWN_SECONDS:-30}
    command: ["api"]
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    stop_grace_period: 40s

  worker:
    build:
      context: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://ai_ranking:ai_ranking@postgres:5432/ai_ranking}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      APP_VERSION: ${APP_VERSION:-1.0.0-rc2.1}
      PROVIDER_MOCK_MODE: ${PROVIDER_MOCK_MODE:-true}
    command: ["worker"]
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 40s

volumes:
  postgres_data:
  redis_data:
