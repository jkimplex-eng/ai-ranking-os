name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend Quality and Playwright
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  quality:
    name: Ruff and Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.lock
      - name: Ruff
        run: ruff check .
      - name: Pytest
        env:
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
        run: pytest
      - name: Compileall
        run: python -m compileall -q .

  migrations:
    name: PostgreSQL Alembic Upgrade and Downgrade
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ai_ranking
          POSTGRES_USER: ai_ranking
          POSTGRES_PASSWORD: ai_ranking
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_ranking -d ai_ranking"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://ai_ranking:ai_ranking@localhost:5432/ai_ranking
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -r requirements.lock
      - name: Upgrade, downgrade latest, upgrade
        run: >-
          alembic -c backend/alembic.ini upgrade head &&
          alembic -c backend/alembic.ini downgrade 0040 &&
          alembic -c backend/alembic.ini upgrade head

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ai-ranking-os:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Runtime smoke and container healthcheck
        run: |
          docker run -d --name ai-ranking-api -p 8000:8000 \
            -e WEB_CONCURRENCY=1 \
            -e RUN_MIGRATIONS=false \
            ai-ranking-os:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              docker inspect --format='{{json .State.Health.Status}}' ai-ranking-api
              exit 0
            fi
            sleep 1
          done
          docker logs ai-ranking-api
          exit 1

  production-compose:
    name: Production Compose Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create isolated CI environment
        working-directory: deployment/production
        run: |
          cp .env.example .env
          sed -i 's/replace-with-long-random-password/ci-password-123456789/g' .env
          sed -i 's#replace-with-url-encoded-password#ci-password-123456789#g' .env
          sed -i 's/replace-with-at-least-32-random-bytes/ci-jwt-secret-123456789012345678901234567890/g' .env
          sed -i 's/admin@example.com/ci@example.com/g' .env
          sed -i 's/replace-with-strong-password/ci-admin-password-123/g' .env
          sed -i 's/replace-with-git-sha/${{ github.sha }}/g' .env
          sed -i 's/replace-with-immutable-tag/ci/g' .env
      - name: Validate and start production stack
        working-directory: deployment/production
        run: |
          docker compose --env-file .env config --quiet
          docker compose --env-file .env build
          docker compose --env-file .env up -d postgres redis
          docker compose --env-file .env run --rm --no-deps backend alembic -c backend/alembic.ini upgrade head
          docker compose --env-file .env up -d
          docker compose --env-file .env ps
      - name: Production API smoke
        working-directory: deployment/production
        env:
          SMOKE_BASE_URL: http://127.0.0.1:8100
          SMOKE_EMAIL: ci@example.com
          SMOKE_PASSWORD: ci-admin-password-123
        run: python scripts/smoke_test.py
      - name: Container logs
        if: failure()
        working-directory: deployment/production
        run: docker compose --env-file .env logs --no-color
