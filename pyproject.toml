[project]
name = "ai-ranking-os"
version = "1.0.0"
description = "Foundation for an AI ranking operating system."
requires-python = ">=3.13,<3.14"
dynamic = ["dependencies"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
