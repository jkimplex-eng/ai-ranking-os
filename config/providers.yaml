providers:
  - name: openai
    region: GLOBAL
    protocol: openai
    base_url: https://api.openai.com/v1
    credential: OPENAI_API_KEY
    mock: true
    rate_limits: {rpm: 500, tpm: 500000, concurrent_requests: 20, retry_budget: 3}
    models:
      - id: gpt-4o-mini
        context_window: 128000
        max_output_tokens: 16384
        capabilities: [chat, streaming, function_calling, json_mode, vision, tool_use]
      - id: text-embedding-3-small
        context_window: 8191
        max_output_tokens: 1
        capabilities: [embeddings]
  - name: anthropic
