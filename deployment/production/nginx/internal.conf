map $http_upgrade $connection_upgrade { default upgrade; "" close; }
upstream backend_upstream { server backend:8000; keepalive 32; }
upstream frontend_upstream { server frontend:8080; keepalive 16; }

server {
  listen 8080;
  server_name _;
  server_tokens off;
  client_max_body_size 10m;
  gzip on;
  gzip_types application/json application/javascript text/css text/plain image/svg+xml;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location = /health { proxy_pass http://backend_upstream/health; access_log off; }
  location = /ready { proxy_pass http://backend_upstream/ready; access_log off; }
  location = /live { proxy_pass http://backend_upstream/live; access_log off; }
  location = /metrics { proxy_pass http://backend_upstream/metrics; }
  location /docs { proxy_pass http://backend_upstream/docs; }
  location = /openapi.json { proxy_pass http://backend_upstream/openapi.json; }
  # EIS already owns the versioned /api prefix in its public contract. Preserve it instead of
  # applying the legacy API-prefix stripping used by the rest of the application.
  location /api/v1/eis/ {
    proxy_pass http://backend_upstream/api/v1/eis/;
  }
  location /api/ {
    proxy_pass http://backend_upstream/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    # A full local-model research runs a deterministic query matrix and can
    # legitimately outlive the default proxy timeout.
    proxy_read_timeout 900s;
  }
  location /assets/ { proxy_pass http://frontend_upstream; expires 1y; add_header Cache-Control "public, immutable"; }
  location / { proxy_pass http://frontend_upstream; proxy_set_header Host $host; }
}
