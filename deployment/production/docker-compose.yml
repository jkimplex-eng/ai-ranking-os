name: ${COMPOSE_PROJECT_NAME:-ai-ranking-os-production}

x-backend: &backend
  image: ${APP_IMAGE:-ai-ranking-os}:${IMAGE_TAG:-local}
  build:
    context: ../..
    dockerfile: Dockerfile
  env_file:
    - path: .env
      required: false
  environment:
    APP_ENV: production
    APP_VERSION: ${APP_VERSION}
    BUILD_SHA: ${BUILD_SHA}
    RELEASE_CHANNEL: production
    DATABASE_URL: ${DATABASE_URL}
    REDIS_URL: ${REDIS_URL}
    AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
    SECURITY_ENFORCE_AUTH: "true"
    PROVIDER_MOCK_MODE: ${PROVIDER_MOCK_MODE:-false}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
    DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-20}
    DATABASE_POOL_TIMEOUT_SECONDS: ${DATABASE_POOL_TIMEOUT_SECONDS:-30}
    DATABASE_POOL_RECYCLE_SECONDS: ${DATABASE_POOL_RECYCLE_SECONDS:-1800}
    GRACEFUL_SHUTDOWN_SECONDS: ${GRACEFUL_SHUTDOWN_SECONDS:-30}
  networks: [app]
  extra_hosts:
    - "host.docker.internal:host-gateway"
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    networks: [app]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
    deploy:
      resources:
        limits: { memory: 1G }

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes: [redis_data:/data]
    networks: [app]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment: { REDIS_PASSWORD: "${REDIS_PASSWORD}" }
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
    deploy:
      resources:
        limits: { memory: 320M }

  backend:
    <<: *backend
    command: ["api"]
    environment:
      APP_ENV: production
      APP_VERSION: ${APP_VERSION}
      BUILD_SHA: ${BUILD_SHA}
      RELEASE_CHANNEL: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      SECURITY_ENFORCE_AUTH: "true"
      PROVIDER_MOCK_MODE: ${PROVIDER_MOCK_MODE:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      RUN_MIGRATIONS: "false"
      BOOTSTRAP_ADMIN: "true"
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_DISPLAY_NAME: ${ADMIN_DISPLAY_NAME:-AI Ranking OS Administrator}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-20}
      DATABASE_POOL_TIMEOUT_SECONDS: ${DATABASE_POOL_TIMEOUT_SECONDS:-30}
      DATABASE_POOL_RECYCLE_SECONDS: ${DATABASE_POOL_RECYCLE_SECONDS:-1800}
      GRACEFUL_SHUTDOWN_SECONDS: ${GRACEFUL_SHUTDOWN_SECONDS:-30}
      YANDEX_WEBMASTER_CLIENT_ID: ${YANDEX_WEBMASTER_CLIENT_ID:-}
      YANDEX_WEBMASTER_CLIENT_SECRET: ${YANDEX_WEBMASTER_CLIENT_SECRET:-}
      YANDEX_WEBMASTER_REDIRECT_URI: ${YANDEX_WEBMASTER_REDIRECT_URI:-https://app.разуммаркета.рф/api/integrations/yandex-webmaster/callback}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    stop_grace_period: 40s
    deploy:
      resources:
        limits: { memory: 1G }

  worker:
    <<: *backend
    command: ["worker"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import os,signal; os.kill(1,0)' "]
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 40s
    deploy:
      resources:
        limits: { memory: 512M }

  frontend:
    image: ${FRONTEND_IMAGE:-ai-ranking-os-frontend}:${IMAGE_TAG:-local}
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    networks: [app]
    restart: unless-stopped
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    deploy:
      resources:
        limits: { memory: 128M }

  nginx:
    image: nginx:1.28-alpine
    depends_on:
      backend: { condition: service_healthy }
      frontend: { condition: service_healthy }
    ports: ["127.0.0.1:${EDGE_PORT:-8100}:8080"]
    volumes:
      - ./nginx/internal.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_logs:/var/log/nginx
    networks: [app]
    restart: unless-stopped
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
    deploy:
      resources:
        limits: { memory: 128M }

networks:
  app:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  nginx_logs:
