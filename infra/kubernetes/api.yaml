apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-ranking-os-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-ranking-os-api
  template:
    metadata:
      labels:
        app: ai-ranking-os-api
    spec:
      terminationGracePeriodSeconds: 40
      containers:
        - name: api
          image: ghcr.io/jkimplex-eng/ai-ranking-os:latest
          args: ["api"]
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: APP_ENV
              value: production
            - name: WEB_CONCURRENCY
              value: "1"
            - name: RUN_MIGRATIONS
              value: "false"
            - name: SECURITY_ENFORCE_AUTH
              value: "true"
          envFrom:
            - secretRef:
                name: ai-ranking-os-secrets
          readinessProbe:
            httpGet:
              path: /observability/readiness
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /observability/liveness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 2
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ai-ranking-os-api
spec:
  selector:
    app: ai-ranking-os-api
  ports:
    - name: http
      port: 80
      targetPort: http
